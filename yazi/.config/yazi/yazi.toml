# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

[mgr]
ratio          = [ 1, 2, 5 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
# title_format was REMOVED in yazi 26.5.6 (#3684) -> see init.lua (ind-app-title DDS event)

[preview]
wrap            = "no"
tab_size        = 5
max_width       = 2240
max_height      = 1000
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR", block = true, for = "unix" },
	{ run = "code %s",    orphan = true, desc = "code",           for = "windows" },
	{ run = "code -w %s", block = true,  desc = "code (block)",   for = "windows" },
]
open = [
	{ run = "xdg-open %s1",                desc = "Open", for = "linux" },
	{ run = "open %s",                    desc = "Open", for = "macos" },
	{ run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
# Was an inline `{ name = "xml-as-text", ... }` entry inside `open` above, which is not a
# valid opener field -- `use = "xml-as-text"` below never resolved. Now a real opener block.
xml-as-text = [
	{ run = "bat --style=numbers --language=txt %s1", desc = "XML as text", block = false, for = "unix" },
]
reveal = [
	{ run = "xdg-open %d1",           desc = "Reveal", for = "linux" },
	{ run = "open -R %s1",                         desc = "Reveal", for = "macos" },
	{ run = "explorer /select,%s1", orphan = true, desc = "Reveal", for = "windows" },
	{ run = "exiftool %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here", for = "unix" },
	{ run = "ya pub extract --list %s",   desc = "Extract here", for = "windows" },
]
play = [
	{ run = "mpv --force-window %s", orphan = true, for = "unix" },
	{ run = "mpv --force-window %s", orphan = true, for = "windows" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]

[open]
# `name` -> `url` for open rules (yazi 25.12.29, #3034)
rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]

prepend_rules = [
	{ mime = "text/xml",        use = "xml-as-text" },
	{ mime = "application/xml", use = "xml-as-text" },
]

[tasks]
# micro_workers / macro_workers were REMOVED in yazi 26.5.6 (#3661)
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 0, 0 ]
suppress_preload = false

[plugin]
# `name` -> `url` for previewers/preloaders (yazi 25.12.29, #3034)
prepend_previewers = [
	# { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
	{ url = "*.rst",     run = "rich-preview" }, # restructured text
	{ url = "*.ipynb",   run = "rich-preview" }, # jupyter notebooks
	{ url = "*.csv",     run = "duckdb" },
	{ url = "*.tsv",     run = "duckdb" },
	{ url = "*.parquet", run = "duckdb" },
	{ url = "*.txt",     run = "bat" },
	{ url = "*.xlsx",    run = "duckdb" },
	{ url = "*.db",      run = "duckdb" },
	{ url = "*.duckdb",  run = "duckdb" },
	{ url = "*.md",      run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
	{ url = "*/",        run = 'piper -- eza -la --git --no-user --color=always --icons=always --group-directories-first --sort=modified --reverse --no-quotes "$1"' },
	{ url = "*.json",   run = "bat" },
	{ url = "*.yaml",   run = "bat" },
	{ url = "*.yml",    run = "bat" },
	{ url = "*.toml",   run = "bat" },
	{ url = "*.js",     run = "bat" },
	{ url = "*.ts",     run = "bat" },
	{ url = "*.jsx",    run = "bat" },
	{ url = "*.tsx",    run = "bat" },
	{ url = "*.py",     run = "bat" },
	{ url = "*.rs",     run = "bat" },
	{ url = "*.go",     run = "bat" },
	{ url = "*.sh",     run = "bat" },
	{ url = "*.bash",   run = "bat" },
	{ url = "*.zsh",    run = "bat" },
	{ url = "*.fish",   run = "bat" },
	{ url = "*.vim",    run = "bat" },
	{ url = "*.lua",    run = "bat" },
	{ url = "*.rb",     run = "bat" },
	{ url = "*.java",   run = "bat" },
	{ url = "*.c",      run = "bat" },
	{ url = "*.cpp",    run = "bat" },
	{ url = "*.h",      run = "bat" },
	{ url = "*.hpp",    run = "bat" },
	{ url = "*.css",    run = "bat" },
	{ url = "*.scss",   run = "bat" },
	{ url = "*.html",   run = "bat" },
	{ mime = "text/xml", run = "rich" },
	{ url = "*.xml",    run = "rich" },
	{ url = "*.sql",        run = "bat" },
	{ url = "*.dockerfile", run = "bat" },
	{ url = "*Dockerfile*", run = "bat" },
	{ url = "*.conf",       run = "bat" },
	{ url = "*.ini",        run = "bat" },
	{ url = "*.svelte",     run = "bat" },
	{ url = "*.swi",        run = "bat" },
	{ url = "*.env",        run = "bat" },
	{ url = "*.env*",       run = "bat" },
	{ url = "*.mustache",   run = "bat" },
]

# NOTE: this block used to sit *inside* the last [[open.prepend_rules]] table, so it was
# silently inert. Moved under [plugin] where it belongs -- duckdb/rich preloading now works.
prepend_preloaders = [
	{ url = "*.csv",     run = "duckdb", multi = false },
	{ url = "*.tsv",     run = "duckdb", multi = false },
	{ url = "*.parquet", run = "duckdb", multi = false },
	{ url = "*.txt",     run = "duckdb", multi = false },
	{ url = "*.xlsx",    run = "duckdb", multi = false },
	{ url = "*.xml",     run = "rich",   multi = false },
]

# The full `fetchers` / `spotters` / `preloaders` / `previewers` preset copies that used to
# live here were also nested inside [[open.prepend_rules]] and therefore inert. They were
# verbatim copies of yazi's presets, so dropping them changes nothing -- yazi's own presets
# apply. (Re-adding them would have OVERRIDDEN the presets, i.e. a behaviour change.)

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title  = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [ 0, 0, 70, 20 ]

# delete
delete_title  = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [ 0, 0, 70, 20 ]

# overwrite
overwrite_title   = "Overwrite file?"
overwrite_body    = "Will overwrite the following file:"
overwrite_origin  = "center"
overwrite_offset  = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Quit?"
quit_body   = "The following task is still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false

# git.yazi fetchers -- your init.lua calls require("git"):setup() but this block was
# commented out (and used the pre-26.x `id`/`name` keys), so git status signs never showed.
# 26.x syntax: `url` instead of `name`, `group` instead of `id`.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
